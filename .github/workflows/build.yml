name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      # 收款码不进仓库：有 secret 时解码写入 assets/，没有（fork）则静默跳过、构建照常成功。
      # node 一行跨平台（mac/windows runner 都能跑）。
      - name: Inject sponsor QR (optional)
        run: node -e "const b=process.env.SPONSOR_QR_B64; if(b){require('fs').mkdirSync('assets',{recursive:true}); require('fs').writeFileSync('assets/sponsor-wechat.jpg', Buffer.from(b,'base64'))}"
        env:
          SPONSOR_QR_B64: ${{ secrets.SPONSOR_QR_B64 }}
      - name: Build
        run: npm run dist -- --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peekphone-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
